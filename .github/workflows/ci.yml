name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Not in the runtime freeze: linter + stubs used only for static checks.
          pip install ruff types-requests

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy)
        run: mypy src

      # The test suite covers the harness gates only: they are pure functions with
      # no BigQuery, Cube or Anthropic dependency, so CI needs no cloud credentials.
      - name: Test (pytest)
        run: pytest
